name: Verify release candidate
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    # Match the native GDAL/PROJ platform used for the reviewed geometry bytes.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.1"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/raw
          key: reviewed-sources-${{ runner.os }}-${{ hashFiles('data/sources.lock.json') }}
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          npm ci
          npx playwright install --with-deps chromium firefox webkit
      - name: Build and verify reviewed data
        run: |
          python -m scripts.data_pipeline fetch
          python -m scripts.data_pipeline build
          python -m unittest discover -s tests -v
          npm run build
          npm run audit:release
          npm run test:release
      - name: Verify resident workflows in three browser engines
        run: npm run test:browsers
      - name: Retain exact candidate and evidence
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          retention-days: 1
          path: |
            dist/
            reports/release-candidate.json
            reports/mobile-performance-milestone-four.json
            data/processed/hrm/validation.json
      - name: Retain failed browser traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-browser-checks
          retention-days: 1
          path: |
            test-results/
            data/processed/hrm/artifacts.json
            data/processed/hrm/income.geojson
            data/processed/hrm/income.csv
