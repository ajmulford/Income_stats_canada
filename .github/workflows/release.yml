name: Reviewed GitHub Pages release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after the recorded manual checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reviewed-pages-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.repository.private
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .
      - name: Check exact candidate before publication
        run: npm run check:release
      - name: Stamp the actual release date
        run: |
          export RELEASE_DATE="$(TZ=America/Halifax date +%F)"
          npm run audit:release
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy the reviewed artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Check the deployed release and original CSV
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke-release.mjs
