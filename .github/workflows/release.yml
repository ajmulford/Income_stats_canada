name: Reviewed GitHub Pages release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after the recorded manual checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reviewed-pages-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !github.event.repository.private
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate
          path: .
      - name: Check exact candidate before publication
        run: npm run check:release
      - name: Stamp the actual release date
        run: |
          export RELEASE_DATE="$(TZ=America/Halifax date +%F)"
          npm run audit:release
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Deploy the reviewed artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check the deployed release and original CSV
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/smoke-release.mjs
