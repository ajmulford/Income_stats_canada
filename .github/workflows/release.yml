name: Reviewed Cloudflare Workers release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after the recorded manual checks pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reviewed-cloudflare-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  publish:
    if: inputs.publish && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: cloudflare-workers
      url: ${{ vars.CLOUDFLARE_SITE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .
      - name: Check exact candidate before publication
        run: npm run check:release
      - name: Stamp the actual release date
        run: |
          export RELEASE_DATE="$(TZ=America/Halifax date +%F)"
          npm run audit:release
      - name: Validate Cloudflare deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_WORKER_NAME"
          node -e 'const u = new URL(process.env.SITE_URL); if (u.protocol !== "https:") throw new Error("CLOUDFLARE_SITE_URL must use HTTPS");'
      - name: Install pinned deployment CLI
        run: npm ci
      - name: Deploy the reviewed artifact to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_WORKER_NAME"
          npx wrangler deploy --config wrangler.json --name="$CLOUDFLARE_WORKER_NAME"
      - name: Check the deployed release and original CSV
        env:
          SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
        run: node scripts/smoke-release.mjs
